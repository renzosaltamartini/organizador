      if (!elemento) return;
      let inicio = 0;
      const incremento = final / (duracion / 16); 
      
      function actualizar() {
        inicio += incremento;
        if (inicio < final) {
          elemento.innerText = `${prefijo}${Math.ceil(inicio).toLocaleString()}`;

        } else {

      const liveDate = document.getElementById('live-date');
      
      if (liveClock) liveClock.innerText = `${h}:${m}:${s}`;
      if (liveDate) {
        const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
        liveDate.innerText = ahora.toLocaleDateString('es-ES', opciones);
      }
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // --- PANEL TU DÍA SCHEDULE ---
    const diasSemanaNombres = [
      { id: '1', nombre: 'Lun' },
      { id: '2', nombre: 'Mar' },
      { id: '3', nombre: 'Mié' },
      { id: '4', nombre: 'Jue' },
      { id: '5', nombre: 'Vie' },
      { id: '6', nombre: 'Sáb' },
      { id: '0', nombre: 'Dom' }
    ];

    let diaSeleccionadoTuDia = String(new Date().getDay());
    let zoomLevelTuDia = 100;

    function obtenerTuDiaItems() {
      return JSON.parse(localStorage.getItem('tuDiaScheduleItems') || '{}');
    }

    function guardarTuDiaItems(data) {
      localStorage.setItem('tuDiaScheduleItems', JSON.stringify(data));
      renderizarScheduleTuDia();
    }

    const scheduleDayTabs = document.getElementById('schedule-day-tabs');
    const scheduleTimelineContainer = document.getElementById('schedule-timeline-container');
    const scheduleZoomLabel = document.getElementById('schedule-zoom-label');

    function renderizarTabsDia() {
      const hoyNum = String(new Date().getDay());
      scheduleDayTabs.innerHTML = '';

      diasSemanaNombres.forEach(d => {
        const esSeleccionado = (d.id === diaSeleccionadoTuDia);
        let activeClasses = esSeleccionado 
          ? 'bg-white text-black font-medium' 
          : 'bg-transparent text-zinc-500 border border-zinc-800 hover:text-zinc-300 hover:border-zinc-700';

        scheduleDayTabs.innerHTML += `
          <button type="button" onclick="window.cambiarDiaTuDia('${d.id}')" 
                  class="px-4 py-1.5 rounded-lg text-xs font-mono transition shrink-0 ${activeClasses}">
            ${d.nombre}
          </button>
        `;
      });
    }

    window.cambiarDiaTuDia = function(diaId) {
      diaSeleccionadoTuDia = diaId;
      renderizarTabsDia();
      renderizarScheduleTuDia();
    };

    document.getElementById('schedule-zoom-in').addEventListener('click', () => {
      if (zoomLevelTuDia < 200) { zoomLevelTuDia += 25; actualizarZoomUI(); }
    });
    document.getElementById('schedule-zoom-out').addEventListener('click', () => {
      if (zoomLevelTuDia > 50) { zoomLevelTuDia -= 25; actualizarZoomUI(); }
    });

    function actualizarZoomUI() {
      scheduleZoomLabel.innerText = `${zoomLevelTuDia}%`;
      renderizarScheduleTuDia();
    }

    function renderizarScheduleTuDia() {
      renderizarTabsDia();
      const allItems = obtenerTuDiaItems();
      const diaItems = allItems[diaSeleccionadoTuDia] || [];
      diaItems.sort((a, b) => a.horaInicio.localeCompare(b.horaInicio));

      scheduleTimelineContainer.innerHTML = '';
      const baseRowHeight = Math.max(40, Math.round(50 * (zoomLevelTuDia / 100)));

      const ahora = new Date();
      const horaActualNum = ahora.getHours();
      const esHoySeleccionado = (String(ahora.getDay()) === diaSeleccionadoTuDia);

      for (let hora = 7; hora <= 23; hora++) {
        const horaFormatted = String(hora).padStart(2, '0') + ':00';
        const esHoraActual = (esHoySeleccionado && hora === horaActualNum);

        const actividadesEnHora = diaItems.filter(item => parseInt(item.horaInicio.split(':')[0], 10) === hora);

        let itemsHtml = '';
        actividadesEnHora.forEach((item) => {
          const globalIdx = diaItems.indexOf(item);
          // Estilo minimalista por categoría (solo indicador izquierdo sutil)
          const colores = {
            estudio: 'border-l-zinc-300',
            trabajo: 'border-l-zinc-500',
            deporte: 'border-l-zinc-400',
            personal: 'border-l-zinc-600'
          };
          const bColor = colores[item.categoria] || 'border-l-zinc-500';

          itemsHtml += `
            <div class="bg-[#121214] border border-zinc-800 border-l-2 ${bColor} rounded-lg p-2.5 my-1 flex justify-between items-start transition hover:border-zinc-700">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="font-medium text-white text-[11px] uppercase tracking-wide">${item.titulo}</span>
                  <span class="text-[10px] font-mono text-zinc-500">${item.horaInicio}-${item.horaFin}</span>
                </div>
                ${item.notas ? `<p class="text-[10px] text-zinc-500">${item.notas}</p>` : ''}
              </div>
              <button onclick="window.eliminarItemTuDia('${diaSeleccionadoTuDia}', ${globalIdx})" class="text-zinc-600 hover:text-white p-1 transition">
                <i data-lucide="x" class="w-3 h-3"></i>
              </button>
            </div>
          `;
        });

        scheduleTimelineContainer.innerHTML += `
          <div class="schedule-hour-row flex items-start gap-4 border-b border-zinc-800/50 py-1 ${esHoraActual ? 'bg-zinc-900/30 -mx-4 px-4 border-l-2 border-l-white' : ''}" style="min-height: ${baseRowHeight}px;">
            <div class="w-16 shrink-0 pt-1">
              <span class="text-[10px] font-mono ${esHoraActual ? 'text-white font-bold' : 'text-zinc-600'}">${horaFormatted}</span>
            </div>
            <div class="w-full flex-1 min-h-[30px]">${itemsHtml}</div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    window.eliminarItemTuDia = function(diaId, index) {
      let allItems = obtenerTuDiaItems();
      if (allItems[diaId]) {
        allItems[diaId].splice(index, 1);
        guardarTuDiaItems(allItems);
      }
    };

    document.getElementById('form-schedule-item').addEventListener('submit', (e) => {
      e.preventDefault();
      const titulo = document.getElementById('sch-titulo').value.trim();
      const horaInicio = document.getElementById('sch-hora-inicio').value;
      const horaFin = document.getElementById('sch-hora-fin').value;
      const categoria = document.getElementById('sch-categoria').value;
      const notas = document.getElementById('sch-notas').value.trim();

      let allItems = obtenerTuDiaItems();
      if (!allItems[diaSeleccionadoTuDia]) allItems[diaSeleccionadoTuDia] = [];
      allItems[diaSeleccionadoTuDia].push({ titulo, horaInicio, horaFin, categoria, notas });
      guardarTuDiaItems(allItems);
      document.getElementById('form-schedule-item').reset();
    });

    renderizarScheduleTuDia();
    setInterval(renderizarScheduleTuDia, 60000);

    // --- AUTENTICACIÓN ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.email === ALLOWED_EMAIL) {
          desbloquearApp();
        } else {
          errorLogin.innerText = "Acceso denegado.";
          errorLogin.classList.remove('hidden');
          signOut(auth);
        }
      } else {
        bloquearApp();
      }
    });

    btnGoogleLogin.addEventListener('click', () => {
      errorLogin.classList.add('hidden');
      signInWithPopup(auth, provider).catch(() => {
        errorLogin.classList.remove('hidden');
      });
    });

    btnLogout.addEventListener('click', () => {
      signOut(auth).then(() => location.reload());
    });

    function desbloquearApp() {
      loginModal.classList.add('hidden');
      appContent.classList.remove('hidden');
      if (!db) iniciarFirebase();
    }

    function bloquearApp() {
      loginModal.classList.remove('hidden');
      appContent.classList.add('hidden');
    }

    // --- FIREBASE SYNC (Gastos, Recordatorios, Parciales) ---
    let eventosParcialesGlobal = [];

    function iniciarFirebase() {
      db = getDatabase(app);

      const gastosRef = ref(db, 'gastos');
      const recordatoriosRef = ref(db, 'recordatorios');
      const parcialesRef = ref(db, 'parciales');

      // --- PARCIALES & CALENDARIO ---
      onValue(parcialesRef, (snapshot) => {
        const data = snapshot.val();
        const grid = document.getElementById('grid-parciales');
        grid.innerHTML = '';
        eventosParcialesGlobal = [];

        if (data) {
          Object.keys(data).forEach((key) => {
            const item = data[key];
            eventosParcialesGlobal.push({ id: key, ...item });
            const fechaTextoLegible = formatearFechaTexto(item.fecha);

            grid.innerHTML += `
              <div class="bg-black border border-zinc-800 hover:border-zinc-600 p-4 rounded-xl flex justify-between items-start transition duration-300">
                <div>
                  <h4 class="font-medium text-xs text-white uppercase tracking-wide">${item.materia}</h4>
                  <p class="text-[10px] text-zinc-500 font-mono mt-1">${fechaTextoLegible}</p>
                  ${item.detalle ? `<p class="text-[11px] text-zinc-400 mt-2">${item.detalle}</p>` : ''}
                </div>
                <button data-id="${key}" class="btn-del-parcial text-zinc-600 hover:text-white transition">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `;
          });
        } else {
          grid.innerHTML = '<p class="text-xs text-zinc-600 col-span-3">No hay registros</p>';
        }

        lucide.createIcons();
        bindDelete('btn-del-parcial', 'parciales');
        renderizarCalendario();
      });

      document.getElementById('form-parcial').addEventListener('submit', (e) => {
        e.preventDefault();
        const materia = document.getElementById('parcial-materia').value;
        const fecha = document.getElementById('parcial-fecha').value;
        const detalle = document.getElementById('parcial-detalle').value;
        push(parcialesRef, { materia, fecha, detalle });
        e.target.reset();
      });

      // --- RECORDATORIOS ---
      onValue(recordatoriosRef, (snapshot) => {
        const data = snapshot.val();
        const lista = document.getElementById('lista-recordatorios');
        const widgetPendientes = document.getElementById('widget-pendientes');
        lista.innerHTML = '';

        if (data) {
          const arr = Object.keys(data).map(key => ({ key, ...data[key] }));
          animarNumero(widgetPendientes, arr.length, 800);

          const grupos = {};
          arr.forEach(item => {
            const titulo = item.tituloOpcional ? item.tituloOpcional.trim() : 'General';
            if (!grupos[titulo]) grupos[titulo] = [];
            grupos[titulo].push(item);
          });

          Object.keys(grupos).forEach(titulo => {
            let grupoHtml = `
              <div class="mb-4">
                <h5 class="text-[10px] font-mono uppercase tracking-widest text-zinc-500 mb-2 border-b border-zinc-800/50 pb-1">${titulo}</h5>
                <ul class="space-y-1.5">
            `;
            grupos[titulo].forEach(item => {
              grupoHtml += `
                <li class="flex justify-between items-start text-xs text-zinc-300 hover:bg-zinc-900/50 p-2 rounded-lg transition group">
                  <div class="font-light leading-relaxed whitespace-pre-wrap">${item.detalle}</div>
                  <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity ml-2">
                    <button data-id="${item.key}" data-detalle="${item.detalle}" class="btn-edit-rec text-zinc-500 hover:text-white transition">
                      <i data-lucide="pencil" class="w-3 h-3"></i>
                    </button>
                    <button data-id="${item.key}" class="btn-del-rec text-zinc-500 hover:text-white transition">
                      <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                  </div>
                </li>
              `;
            });
            grupoHtml += `</ul></div>`;
            lista.innerHTML += grupoHtml;
          });
        } else {
          widgetPendientes.innerText = '0';
          lista.innerHTML = '<p class="text-xs text-zinc-600">Sin tareas pendientes</p>';
        }

        lucide.createIcons();
        bindDelete('btn-del-rec', 'recordatorios');
        
        document.querySelectorAll('.btn-edit-rec').forEach(btn => {
          btn.onclick = () => {
            const id = btn.getAttribute('data-id');
            const detalleActual = btn.getAttribute('data-detalle');
            const nuevoDetalle = prompt("Edita tu tarea:", detalleActual);
            if (nuevoDetalle && nuevoDetalle.trim() !== "" && nuevoDetalle !== detalleActual) {
              set(ref(db, `recordatorios/${id}/detalle`), nuevoDetalle.trim());
            }
          };
        });
      });

      document.getElementById('form-recordatorio').addEventListener('submit', (e) => {
        e.preventDefault();
        const tituloOpcional = document.getElementById('rec-titulo').value.trim();
        const detalle = document.getElementById('rec-detalle').value.trim();
        push(recordatoriosRef, { tituloOpcional, detalle });
        e.target.reset();
      });

      // --- GASTOS ---
      onValue(gastosRef, (snapshot) => {
        const data = snapshot.val();
        const lista = document.getElementById('lista-gastos');
        const widgetTotal = document.getElementById('widget-total-gastos');
        const sectionTotal = document.getElementById('section-total-gastos');
        lista.innerHTML = '';
        let total = 0;

        if (data) {
          Object.keys(data).reverse().forEach((key) => {
            const item = data[key];
            total += parseFloat(item.monto || 0);
            lista.innerHTML += `
              <li class="flex justify-between items-center bg-black border border-zinc-800 px-3 py-2.5 rounded-lg text-xs text-zinc-300 hover:border-zinc-700 transition group">
                <span class="font-light">${item.concepto}</span>
                <div class="flex items-center gap-3">
                  <span class="font-mono text-white">$${Number(item.monto).toLocaleString()}</span>
                  <button data-id="${key}" class="btn-del-gasto text-zinc-600 hover:text-white transition opacity-0 group-hover:opacity-100">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </li>
            `;
          });
        } else {
          lista.innerHTML = '<p class="text-xs text-zinc-600">Sin registros</p>';
        }

        animarNumero(widgetTotal, total, 1000, '$');
        animarNumero(sectionTotal, total, 1000, '$');

        lucide.createIcons();
        bindDelete('btn-del-gasto', 'gastos');
      });

      document.getElementById('form-gasto').addEventListener('submit', (e) => {
        e.preventDefault();
        const concepto = document.getElementById('gasto-concepto').value;
        const monto = parseFloat(document.getElementById('gasto-monto').value);
        push(gastosRef, { concepto, monto });
        e.target.reset();
      });
    }

    // --- CALENDARIO MENSUAL ---
    let fechaActualCal = new Date();

    function renderizarCalendario() {
      const anio = fechaActualCal.getFullYear();
      const mes = fechaActualCal.getMonth();
      const nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      document.getElementById('cal-mes-anio').innerText = `${nombresMeses[mes]} ${anio}`;

      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      const primerDiaIndex = (new Date(anio, mes, 1).getDay() + 6) % 7;
      const totalDiasMes = new Date(anio, mes + 1, 0).getDate();
      const totalDiasMesAnterior = new Date(anio, mes, 0).getDate();
      const hoy = new Date();

      for (let i = primerDiaIndex; i > 0; i--) {
        const diaNum = totalDiasMesAnterior - i + 1;
        grid.innerHTML += `<div class="p-1.5 sm:p-2 min-h-[60px] text-zinc-800 text-[10px] font-mono border-t border-transparent">${diaNum}</div>`;
      }

      for (let dia = 1; dia <= totalDiasMes; dia++) {
        const mesStr = String(mes + 1).padStart(2, '0');
        const diaStr = String(dia).padStart(2, '0');
        const fechaIso = `${anio}-${mesStr}-${diaStr}`;
        const esHoy = (dia === hoy.getDate() && mes === hoy.getMonth() && anio === hoy.getFullYear());

        const parcialesDelDia = eventosParcialesGlobal.filter(p => p.fecha === fechaIso);
        let eventosHtml = '';
        parcialesDelDia.forEach(p => {
          eventosHtml += `
            <div class="bg-zinc-800 text-zinc-300 text-[9px] px-1.5 py-0.5 rounded mt-1 truncate font-medium" title="${p.materia}">
              <span class="hidden sm:inline">${p.materia}</span>
              <span class="sm:hidden font-bold">●</span>
            </div>
          `;
        });

        grid.innerHTML += `
          <div class="border-t ${esHoy ? 'border-white' : 'border-zinc-800/50'} p-1.5 sm:p-2 min-h-[70px] flex flex-col transition hover:bg-zinc-900/30">
            <span class="text-[10px] font-mono ${esHoy ? 'text-white font-bold' : 'text-zinc-500'}">${dia}</span>
            <div class="overflow-y-auto max-h-[45px] space-y-0.5 mt-1">${eventosHtml}</div>
          </div>
        `;
      }
    }

    document.getElementById('cal-prev').addEventListener('click', () => {
      fechaActualCal.setMonth(fechaActualCal.getMonth() - 1);
      renderizarCalendario();
    });

    document.getElementById('cal-next').addEventListener('click', () => {
      fechaActualCal.setMonth(fechaActualCal.getMonth() + 1);
      renderizarCalendario();
    });

    function bindDelete(className, node) {
      document.querySelectorAll(`.${className}`).forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          if (db) remove(ref(db, `${node}/${id}`));
        };
      });
    }
  </script>
</body>
</html>
