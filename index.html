<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Organizador Personal OS</title>
  
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/a/ACg8ocLYSjY5aO_gPGWIOhpKUVtSWB0PoQD1M5ix3HmoGjbXozB2Ob0=s288-c-no" />
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/a/ACg8ocLYSjY5aO_gPGWIOhpKUVtSWB0PoQD1M5ix3HmoGjbXozB2Ob0=s288-c-no" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            bgBase: '#09090b',
            bgCard: '#121216',
            bgHover: '#18181b',
            borderSubtle: '#27272a',
            borderMuted: '#3f3f46',
            accent: '#fafafa',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #09090b;
      color: #a1a1aa;
    }
    .panel-card {
      background-color: #121216;
      border: 1px solid #27272a;
      border-radius: 16px;
      transition: border-color 0.2s ease;
    }
    .panel-card:hover {
      border-color: #3f3f46;
    }
    .minimal-input {
      background-color: #09090b;
      border: 1px solid #27272a;
      color: #f4f4f5;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .minimal-input:focus {
      outline: none;
      border-color: #71717a;
      box-shadow: 0 0 0 1px #71717a;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="min-h-screen antialiased pb-20 selection:bg-white selection:text-black">

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="fixed inset-0 z-[100] bg-[#09090b] flex items-center justify-center p-4">
    <div class="panel-card p-8 max-w-sm w-full text-center space-y-6 shadow-2xl">
      <div class="w-16 h-16 mx-auto rounded-full bg-[#18181b] border border-borderSubtle p-1 flex items-center justify-center overflow-hidden">
        <img src="https://lh3.googleusercontent.com/a/ACg8ocLYSjY5aO_gPGWIOhpKUVtSWB0PoQD1M5ix3HmoGjbXozB2Ob0=s288-c-no" 
             alt="Perfil" class="w-full h-full object-cover rounded-full">
      </div>
      <div class="space-y-1">
        <h1 class="text-lg font-semibold text-white tracking-tight">Organizador</h1>
        <p class="text-xs text-zinc-500">Inicia sesión con tu cuenta autorizada</p>
      </div>

      <div class="space-y-3">
        <button id="btn-google-login" class="w-full bg-white hover:bg-zinc-200 text-zinc-950 py-2.5 px-4 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/>
          </svg>
          Continuar con Google
        </button>
        <p id="error-login" class="text-[11px] text-rose-400 hidden font-mono">Acceso denegado: correo no autorizado.</p>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app-content" class="hidden">

    <!-- Navbar Minimal -->
    <header class="w-full bg-[#09090b]/80 backdrop-blur-md border-b border-borderSubtle sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex justify-between items-center">
        <span class="font-semibold text-white text-sm tracking-tight font-sans">Organizador</span>
        <button id="btn-logout" title="Cerrar sesión" class="p-2 hover:bg-zinc-800 text-zinc-400 hover:text-white rounded-lg transition">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Dashboard Container -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 mt-6 space-y-6">

      <!-- TOP ROW: Perfil & Métricas -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        
        <!-- Perfil limpio -->
        <div class="md:col-span-5 panel-card p-5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-zinc-900 border border-borderSubtle p-0.5 overflow-hidden">
              <img src="https://lh3.googleusercontent.com/a/ACg8ocLYSjY5aO_gPGWIOhpKUVtSWB0PoQD1M5ix3HmoGjbXozB2Ob0=s288-c-no" 
                   alt="Perfil" class="w-full h-full object-cover rounded-full">
            </div>
            <div>
              <h2 class="text-sm font-semibold text-white">Renzo</h2>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                <span class="text-[11px] text-zinc-400 font-mono">Activo</span>
              </div>
            </div>
          </div>
          <span class="text-[11px] font-mono text-zinc-500 bg-zinc-900 px-2.5 py-1 rounded-md border border-borderSubtle">v2.0</span>
        </div>

        <!-- Métricas -->
        <div class="md:col-span-7 grid grid-cols-2 gap-4">
          <div class="panel-card p-4 flex flex-col justify-between">
            <div class="flex items-center justify-between text-zinc-400 text-xs">
              <span>Gastos Totales</span>
              <i data-lucide="wallet" class="w-3.5 h-3.5 text-zinc-500"></i>
            </div>
            <span id="widget-total-gastos" class="text-lg font-semibold font-mono text-white tracking-tight mt-2 block">
              $0
            </span>
          </div>

          <div class="panel-card p-4 flex flex-col justify-between">
            <div class="flex items-center justify-between text-zinc-400 text-xs">
              <span>Pendientes</span>
              <i data-lucide="check-square" class="w-3.5 h-3.5 text-zinc-500"></i>
            </div>
            <span id="widget-pendientes" class="text-lg font-semibold font-mono text-white tracking-tight mt-2 block">
              0
            </span>
          </div>
        </div>

      </div>

      <!-- CRONOGRAMA EN VIVO (ESTILO GOOGLE CALENDAR / LINEAR) -->
      <section class="panel-card p-5 space-y-4">
        
        <!-- Live Clock Banner -->
        <div class="bg-zinc-900/60 border border-borderSubtle rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="p-2.5 bg-zinc-800 rounded-lg text-zinc-300">
              <i data-lucide="clock" class="w-5 h-5"></i>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[10px] font-mono uppercase tracking-widest text-zinc-400">Tiempo Real</span>
              </div>
              <div id="live-clock" class="text-2xl font-semibold font-mono text-white tracking-tight">00:00:00</div>
            </div>
          </div>
          <p id="live-date" class="text-xs text-zinc-400 capitalize font-medium"></p>
        </div>

        <!-- Tabs de Días -->
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none" id="schedule-day-tabs">
          <!-- Dinámico -->
        </div>

        <!-- Formulario Actividad -->
        <form id="form-schedule-item" class="grid grid-cols-1 sm:grid-cols-12 gap-2">
          <input type="text" id="sch-titulo" placeholder="Actividad / Título" required 
                 class="sm:col-span-4 minimal-input text-xs px-3.5 py-2.5 placeholder-zinc-600">
          
          <div class="sm:col-span-3 flex items-center gap-1">
            <input type="time" id="sch-hora-inicio" required 
                   class="minimal-input text-xs font-mono px-2 py-2.5 w-full text-center">
            <span class="text-zinc-600 text-xs">-</span>
            <input type="time" id="sch-hora-fin" required 
                   class="minimal-input text-xs font-mono px-2 py-2.5 w-full text-center">
          </div>

          <select id="sch-categoria" class="sm:col-span-2 minimal-input text-xs px-3 py-2.5">
            <option value="zinc">Estudio / General</option>
            <option value="blue">Trabajo / Proyectos</option>
            <option value="emerald">Deporte / Salud</option>
            <option value="amber">Ocio / Personal</option>
            <option value="rose">Urgente</option>
          </select>

          <input type="text" id="sch-notas" placeholder="Notas (opcional)" 
                 class="sm:col-span-2 minimal-input text-xs px-3.5 py-2.5 placeholder-zinc-600">

          <button type="submit" class="sm:col-span-1 bg-white hover:bg-zinc-200 text-zinc-950 rounded-xl text-xs font-semibold transition flex items-center justify-center py-2.5">
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
        </form>

        <!-- Cronograma Vertical de Minutos Exactos -->
        <div class="bg-[#09090b] border border-borderSubtle rounded-xl relative overflow-hidden">
          <div id="calendar-grid-timeline" class="relative w-full h-[700px] overflow-y-auto pr-2">
            <!-- Dinámico -->
          </div>
        </div>
      </section>

      <!-- GRID INFERIOR: Calendario, Parciales, Recordatorios, Gastos -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        
        <!-- CALENDARIO MENSUAL -->
        <section class="panel-card p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="calendar" class="w-4 h-4 text-zinc-400"></i>
              <h3 class="font-semibold text-sm text-white">Calendario Mensual</h3>
            </div>
            <div class="flex items-center gap-1 bg-[#09090b] border border-borderSubtle px-2 py-1 rounded-lg">
              <button id="cal-prev" class="p-1 hover:bg-zinc-800 rounded text-zinc-400 transition">
                <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
              </button>
              <span id="cal-mes-anio" class="text-xs font-semibold text-white w-28 text-center font-mono capitalize"></span>
              <button id="cal-next" class="p-1 hover:bg-zinc-800 rounded text-zinc-400 transition">
                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1 text-center font-mono text-[10px] text-zinc-500 py-1">
            <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
          </div>

          <div id="cal-grid" class="grid grid-cols-7 gap-1 min-h-[260px]">
            <!-- Dinámico -->
          </div>
        </section>

        <!-- FECHAS DE PARCIALES -->
        <section class="panel-card p-5 space-y-4">
          <div class="flex items-center gap-2">
            <i data-lucide="graduation-cap" class="w-4 h-4 text-zinc-400"></i>
            <h3 class="font-semibold text-sm text-white">Exámenes y Parciales</h3>
          </div>

          <form id="form-parcial" class="grid grid-cols-1 sm:grid-cols-12 gap-2">
            <input type="text" id="parcial-materia" placeholder="Materia" required 
                   class="sm:col-span-5 minimal-input text-xs px-3 py-2.5 placeholder-zinc-600">
            <input type="date" id="parcial-fecha" required 
                   class="sm:col-span-4 minimal-input text-xs font-mono px-3 py-2.5 text-zinc-300">
            <button type="submit" class="sm:col-span-3 bg-white hover:bg-zinc-200 text-zinc-950 rounded-xl text-xs font-semibold transition flex items-center justify-center py-2.5">
              Agregar
            </button>
          </form>

          <div id="grid-parciales" class="space-y-2 max-h-[240px] overflow-y-auto pr-1">
            <!-- Dinámico -->
          </div>
        </section>

      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        
        <!-- Recordatorios -->
        <section class="panel-card p-5 space-y-4">
          <div class="flex items-center gap-2">
            <i data-lucide="check-square" class="w-4 h-4 text-zinc-400"></i>
            <h3 class="font-semibold text-sm text-white">Recordatorios</h3>
          </div>

          <form id="form-recordatorio" class="space-y-2">
            <input type="text" id="rec-titulo" placeholder="Título (opcional)" 
                   class="minimal-input text-xs px-3 py-2.5 w-full placeholder-zinc-600">
            <div class="flex gap-2">
              <textarea id="rec-detalle" placeholder="Escribe un recordatorio..." required rows="1"
                        class="minimal-input text-xs px-3 py-2.5 w-full placeholder-zinc-600 resize-none"></textarea>
              <button type="submit" class="bg-white hover:bg-zinc-200 text-zinc-950 px-4 rounded-xl text-xs font-semibold transition shrink-0">
                +
              </button>
            </div>
          </form>

          <ul id="lista-recordatorios" class="space-y-2 max-h-[200px] overflow-y-auto pr-1">
            <!-- Dinámico -->
          </ul>
        </section>

        <!-- Control de Gastos -->
        <section class="panel-card p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="credit-card" class="w-4 h-4 text-zinc-400"></i>
              <h3 class="font-semibold text-sm text-white">Gastos</h3>
            </div>
            <span class="text-xs font-mono text-zinc-400" id="section-total-gastos">$0</span>
          </div>

          <form id="form-gasto" class="flex gap-2">
            <input type="text" id="gasto-concepto" placeholder="Concepto" required 
                   class="minimal-input text-xs px-3 py-2.5 w-full placeholder-zinc-600">
            <input type="number" step="0.01" id="gasto-monto" placeholder="$" required 
                   class="minimal-input text-xs font-mono px-3 py-2.5 w-24 placeholder-zinc-600">
            <button type="submit" class="bg-white hover:bg-zinc-200 text-zinc-950 px-4 rounded-xl text-xs font-semibold transition shrink-0">
              +
            </button>
          </form>

          <ul id="lista-gastos" class="space-y-2 max-h-[200px] overflow-y-auto pr-1">
            <!-- Dinámico -->
          </ul>
        </section>

      </div>

    </main>
  </div>

  <!-- SCRIPT DE LA APLICACIÓN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXGKWZA8kWaN2NWCK2A9jTlGSq-B2bqWA",
      authDomain: "laranchada-6abd3.firebaseapp.com",
      databaseURL: "https://laranchada-6abd3-default-rtdb.firebaseio.com",
      projectId: "laranchada-6abd3",
      storageBucket: "laranchada-6abd3.firebasestorage.app",
      messagingSenderId: "326750839699",
      appId: "1:326750839699:web:3b122315eb61296d99fe66",
      measurementId: "G-XL398QW21P"
    };

    const ALLOWED_EMAIL = "renzosalta07@gmail.com";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    lucide.createIcons();

    const loginModal = document.getElementById('login-modal');
    const appContent = document.getElementById('app-content');
    const btnGoogleLogin = document.getElementById('btn-google-login');
    const errorLogin = document.getElementById('error-login');
    const btnLogout = document.getElementById('btn-logout');

    function formatearFechaTexto(fechaIso) {
      if (!fechaIso) return '';
      const partes = fechaIso.split('-');
      if (partes.length !== 3) return fechaIso;
      const anio = parseInt(partes[0], 10);
      const mes = parseInt(partes[1], 10) - 1;
      const dia = parseInt(partes[2], 10);
      const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
      return `${dia} ${meses[mes]}`;
    }

    // RELOJ EN VIVO
    function actualizarReloj() {
      const ahora = new Date();
      const h = String(ahora.getHours()).padStart(2, '0');
      const m = String(ahora.getMinutes()).padStart(2, '0');
      const s = String(ahora.getSeconds()).padStart(2, '0');
      
      const liveClock = document.getElementById('live-clock');
      const liveDate = document.getElementById('live-date');
      
      if (liveClock) liveClock.innerText = `${h}:${m}:${s}`;
      if (liveDate) {
        const opciones = { weekday: 'short', day: 'numeric', month: 'short' };
        liveDate.innerText = ahora.toLocaleDateString('es-ES', opciones);
      }
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // --- CRONOGRAMA MINUTOS EXACTOS ---
    const diasSemanaNombres = [
      { id: '1', nombre: 'Lunes' },
      { id: '2', nombre: 'Martes' },
      { id: '3', nombre: 'Miércoles' },
      { id: '4', nombre: 'Jueves' },
      { id: '5', nombre: 'Viernes' },
      { id: '6', nombre: 'Sábado' },
      { id: '0', nombre: 'Domingo' }
    ];

    let diaSeleccionadoTuDia = String(new Date().getDay());

    function obtenerTuDiaItems() {
      return JSON.parse(localStorage.getItem('tuDiaScheduleItems') || '{}');
    }

    function guardarTuDiaItems(data) {
      localStorage.setItem('tuDiaScheduleItems', JSON.stringify(data));
      renderizarScheduleTuDia();
    }

    const scheduleDayTabs = document.getElementById('schedule-day-tabs');
    const calendarGridTimeline = document.getElementById('calendar-grid-timeline');

    function renderizarTabsDia() {
      const hoyNum = String(new Date().getDay());
      scheduleDayTabs.innerHTML = '';

      diasSemanaNombres.forEach(d => {
        const esHoy = (d.id === hoyNum);
        const esSeleccionado = (d.id === diaSeleccionadoTuDia);

        let activeClasses = esSeleccionado 
          ? 'bg-white text-zinc-950 font-semibold' 
          : 'bg-[#09090b] text-zinc-400 hover:text-white border border-borderSubtle';

        scheduleDayTabs.innerHTML += `
          <button type="button" onclick="window.cambiarDiaTuDia('${d.id}')" 
                  class="px-3.5 py-1.5 rounded-lg text-xs font-mono transition flex items-center gap-1.5 shrink-0 ${activeClasses}">
            <span>${d.nombre}</span>
            ${esHoy ? `<span class="w-1.5 h-1.5 rounded-full ${esSeleccionado ? 'bg-zinc-950' : 'bg-emerald-500'}"></span>` : ''}
          </button>
        `;
      });
    }

    window.cambiarDiaTuDia = function(diaId) {
      diaSeleccionadoTuDia = diaId;
      renderizarTabsDia();
      renderizarScheduleTuDia();
    };

    function convertirHoraAMinutos(horaStr) {
      if (!horaStr) return 0;
      const partes = horaStr.split(':');
      return parseInt(partes[0], 10) * 60 + parseInt(partes[1], 10);
    }

    function renderizarScheduleTuDia() {
      renderizarTabsDia();
      const allItems = obtenerTuDiaItems();
      let diaItems = allItems[diaSeleccionadoTuDia] || [];

      // Borrado automático al terminar si es el día actual
      const ahora = new Date();
      const esHoySeleccionado = (String(ahora.getDay()) === diaSeleccionadoTuDia);
      const minutosActuales = ahora.getHours() * 60 + ahora.getMinutes();

      if (esHoySeleccionado) {
        diaItems = diaItems.filter(item => convertirHoraAMinutos(item.horaFin) > minutosActuales);
        allItems[diaSeleccionadoTuDia] = diaItems;
        localStorage.setItem('tuDiaScheduleItems', JSON.stringify(allItems));
      }

      calendarGridTimeline.innerHTML = '';

      const coloresCategoria = {
        zinc: { bg: 'bg-zinc-800/80', border: 'border-zinc-700', text: 'text-zinc-100' },
        blue: { bg: 'bg-blue-950/60', border: 'border-blue-800/60', text: 'text-blue-200' },
        emerald: { bg: 'bg-emerald-950/60', border: 'border-emerald-800/60', text: 'text-emerald-200' },
        amber: { bg: 'bg-amber-950/60', border: 'border-amber-800/60', text: 'text-amber-200' },
        rose: { bg: 'bg-rose-950/60', border: 'border-rose-800/60', text: 'text-rose-200' }
      };

      const hourHeight = 60;
      const startHour = 7;
      const totalHours = 17;
      calendarGridTimeline.style.height = `${totalHours * hourHeight}px`;

      let backgroundLinesHtml = '';
      for (let h = startHour; h <= 23; h++) {
        const topPos = (h - startHour) * hourHeight;
        const horaLabel = String(h).padStart(2, '0') + ':00';
        backgroundLinesHtml += `
          <div class="absolute w-full flex items-start border-t border-zinc-800/60" style="top: ${topPos}px; height: ${hourHeight}px;">
            <span class="text-[10px] font-mono text-zinc-600 w-12 pt-1 select-none text-right pr-3">${horaLabel}</span>
          </div>
        `;
      }

      let liveLineHtml = '';
      if (esHoySeleccionado) {
        const liveTop = (minutosActuales - (startHour * 60)) * (hourHeight / 60);
        if (liveTop >= 0 && liveTop <= totalHours * hourHeight) {
          liveLineHtml = `
            <div class="absolute left-12 right-0 z-20 flex items-center pointer-events-none" style="top: ${liveTop}px;">
              <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
              <div class="flex-1 h-[1px] bg-white/60"></div>
            </div>
          `;
        }
      }

      const parsedItems = diaItems.map((item, idx) => {
        const inicioMins = convertirHoraAMinutos(item.horaInicio);
        const finMins = Math.max(convertirHoraAMinutos(item.horaFin), inicioMins + 15);
        return { ...item, originalIndex: idx, inicioMins, finMins };
      });

      parsedItems.forEach((item, i) => {
        item.colIndex = 0;
        item.totalCols = 1;
        let overlapping = parsedItems.filter((other, j) => {
          return j !== i && !(item.finMins <= other.inicioMins || item.inicioMins >= other.finMins);
        });

        if (overlapping.length > 0) {
          item.totalCols = overlapping.length + 1;
          const sameGroup = [item, ...overlapping].sort((a, b) => a.originalIndex - b.originalIndex);
          item.colIndex = sameGroup.findIndex(x => x.originalIndex === item.originalIndex);
        }
      });

      let eventsHtml = '';
      parsedItems.forEach((item) => {
        const topPx = (item.inicioMins - (startHour * 60)) * (hourHeight / 60);
        const durationMins = item.finMins - item.inicioMins;
        const heightPx = Math.max(durationMins * (hourHeight / 60), 28);

        const styleCol = coloresCategoria[item.categoria] || coloresCategoria.zinc;
        const widthPercent = 100 / item.totalCols;
        const leftPercent = item.colIndex * widthPercent;

        eventsHtml += `
          <div class="absolute rounded-lg p-2 border ${styleCol.bg} ${styleCol.border} backdrop-blur-sm overflow-hidden flex flex-col justify-between shadow-sm transition hover:z-30"
               style="top: ${topPx}px; height: ${heightPx}px; left: calc(3rem + ${leftPercent}%); width: calc(100% - 3rem - ${leftPercent}% - ${item.totalCols > 1 ? '4px' : '0px'});">
            <div class="flex justify-between items-start">
              <div class="space-y-0.5 overflow-hidden pr-1">
                <div class="flex items-center gap-1 flex-wrap">
                  <span class="font-semibold ${styleCol.text} text-xs truncate">${item.titulo}</span>
                  <span class="text-[9px] font-mono text-zinc-400">${item.horaInicio}-${item.horaFin}</span>
                </div>
                ${item.notas && heightPx > 45 ? `<p class="text-[10px] text-zinc-400 truncate">${item.notas}</p>` : ''}
              </div>
              <button onclick="window.eliminarItemTuDia('${diaSeleccionadoTuDia}', ${item.originalIndex})" class="text-zinc-500 hover:text-white p-0.5 transition shrink-0">
                <i data-lucide="x" class="w-3 h-3"></i>
              </button>
            </div>
          </div>
        `;
      });

      calendarGridTimeline.innerHTML = backgroundLinesHtml + liveLineHtml + eventsHtml;
      lucide.createIcons();
    }

    window.eliminarItemTuDia = function(diaId, index) {
      let allItems = obtenerTuDiaItems();
      if (allItems[diaId]) {
        allItems[diaId].splice(index, 1);
        guardarTuDiaItems(allItems);
      }
    };

    document.getElementById('form-schedule-item').addEventListener('submit', (e) => {
      e.preventDefault();
      const titulo = document.getElementById('sch-titulo').value.trim();
      const horaInicio = document.getElementById('sch-hora-inicio').value;
      const horaFin = document.getElementById('sch-hora-fin').value;
      const categoria = document.getElementById('sch-categoria').value;
      const notas = document.getElementById('sch-notas').value.trim();

      let allItems = obtenerTuDiaItems();
      if (!allItems[diaSeleccionadoTuDia]) allItems[diaSeleccionadoTuDia] = [];
      allItems[diaSeleccionadoTuDia].push({ titulo, horaInicio, horaFin, categoria, notas });
      guardarTuDiaItems(allItems);
      document.getElementById('form-schedule-item').reset();
    });

    renderizarScheduleTuDia();
    setInterval(renderizarScheduleTuDia, 15000);

    // --- AUTH GOOGLE ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.email === ALLOWED_EMAIL) {
          desbloquearApp();
        } else {
          errorLogin.classList.remove('hidden');
          signOut(auth);
        }
      } else {
        bloquearApp();
      }
    });

    btnGoogleLogin.addEventListener('click', () => {
      errorLogin.classList.add('hidden');
      signInWithPopup(auth, provider).catch(() => {
        errorLogin.classList.remove('hidden');
      });
    });

    btnLogout.addEventListener('click', () => {
      signOut(auth).then(() => location.reload());
    });

    function desbloquearApp() {
      loginModal.classList.add('hidden');
      appContent.classList.remove('hidden');
      iniciarFirebase();
    }

    function bloquearApp() {
      loginModal.classList.remove('hidden');
      appContent.classList.add('hidden');
    }

    // --- FIREBASE REALTIME ---
    let eventosParcialesGlobal = [];
    let firebaseSuscrita = false;

    function iniciarFirebase() {
      renderizarCalendario();
      if (firebaseSuscrita) return;
      firebaseSuscrita = true;

      const gastosRef = ref(db, 'gastos');
      const recordatoriosRef = ref(db, 'recordatorios');
      const parcialesRef = ref(db, 'parciales');

      // PARCIALES
      onValue(parcialesRef, (snapshot) => {
        const data = snapshot.val();
        const grid = document.getElementById('grid-parciales');
        grid.innerHTML = '';
        eventosParcialesGlobal = [];

        if (data) {
          Object.keys(data).forEach((key) => {
            const item = data[key];
            eventosParcialesGlobal.push({ id: key, ...item });
            const fechaTextoLegible = formatearFechaTexto(item.fecha);

            grid.innerHTML += `
              <div class="bg-[#09090b] border border-borderSubtle p-3 rounded-xl flex justify-between items-center text-xs">
                <div>
                  <span class="font-semibold text-white">${item.materia}</span>
                  <span class="text-zinc-400 font-mono ml-2">(${fechaTextoLegible})</span>
                </div>
                <button data-id="${key}" class="btn-del-parcial text-zinc-500 hover:text-white p-1 transition">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `;
          });
        } else {
          grid.innerHTML = '<p class="text-xs text-zinc-500 text-center py-3">Sin exámenes agendados</p>';
        }
        lucide.createIcons();
        bindDelete('btn-del-parcial', 'parciales');
        renderizarCalendario();
      });

      document.getElementById('form-parcial').addEventListener('submit', (e) => {
        e.preventDefault();
        const materia = document.getElementById('parcial-materia').value;
        const fecha = document.getElementById('parcial-fecha').value;
        push(parcialesRef, { materia, fecha, detalle: '' });
        e.target.reset();
      });

      // RECORDATORIOS
      onValue(recordatoriosRef, (snapshot) => {
        const data = snapshot.val();
        const lista = document.getElementById('lista-recordatorios');
        const widgetPendientes = document.getElementById('widget-pendientes');
        lista.innerHTML = '';

        if (data) {
          const arr = Object.keys(data).map(key => ({ key, ...data[key] }));
          widgetPendientes.innerText = arr.length;

          arr.forEach((item) => {
            lista.innerHTML += `
              <li class="flex justify-between items-center bg-[#09090b] border border-borderSubtle px-3 py-2.5 rounded-xl text-xs">
                <span class="text-zinc-200">${item.detalle || item.titulo}</span>
                <button data-id="${item.key}" class="btn-del-rec text-zinc-500 hover:text-white p-1 transition">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </li>
            `;
          });
        } else {
          widgetPendientes.innerText = '0';
          lista.innerHTML = '<p class="text-center py-4 text-xs text-zinc-500">Sin recordatorios</p>';
        }
        lucide.createIcons();
        bindDelete('btn-del-rec', 'recordatorios');
      });

      document.getElementById('form-recordatorio').addEventListener('submit', (e) => {
        e.preventDefault();
        const detalle = document.getElementById('rec-detalle').value.trim();
        push(recordatoriosRef, { tituloOpcional: '', detalle });
        e.target.reset();
      });

      // GASTOS
      onValue(gastosRef, (snapshot) => {
        const data = snapshot.val();
        const lista = document.getElementById('lista-gastos');
        const widgetTotal = document.getElementById('widget-total-gastos');
        const sectionTotal = document.getElementById('section-total-gastos');
        lista.innerHTML = '';
        let total = 0;

        if (data) {
          Object.keys(data).reverse().forEach((key) => {
            const item = data[key];
            total += parseFloat(item.monto || 0);
            lista.innerHTML += `
              <li class="flex justify-between items-center bg-[#09090b] border border-borderSubtle px-3 py-2.5 rounded-xl text-xs">
                <span class="text-zinc-200">${item.concepto}</span>
                <div class="flex items-center gap-2">
                  <span class="font-mono text-white">$${Number(item.monto).toLocaleString()}</span>
                  <button data-id="${key}" class="btn-del-gasto text-zinc-500 hover:text-white p-1 transition">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </li>
            `;
          });
        } else {
          lista.innerHTML = '<p class="text-center py-4 text-xs text-zinc-500">Sin gastos</p>';
        }

        const formattedTotal = `$${total.toLocaleString()}`;
        widgetTotal.innerText = formattedTotal;
        sectionTotal.innerText = formattedTotal;
        lucide.createIcons();
        bindDelete('btn-del-gasto', 'gastos');
      });

      document.getElementById('form-gasto').addEventListener('submit', (e) => {
        e.preventDefault();
        const concepto = document.getElementById('gasto-concepto').value;
        const monto = parseFloat(document.getElementById('gasto-monto').value);
        push(gastosRef, { concepto, monto });
        e.target.reset();
      });
    }

    // CALENDARIO MENSUAL
    let fechaActualCal = new Date();

    function renderizarCalendario() {
      const anio = fechaActualCal.getFullYear();
      const mes = fechaActualCal.getMonth();
      const nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      document.getElementById('cal-mes-anio').innerText = `${nombresMeses[mes]} ${anio}`;

      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      const primerDiaIndex = (new Date(anio, mes, 1).getDay() + 6) % 7;
      const totalDiasMes = new Date(anio, mes + 1, 0).getDate();
      const totalDiasMesAnterior = new Date(anio, mes, 0).getDate();
      const hoy = new Date();

      for (let i = primerDiaIndex; i > 0; i--) {
        const diaNum = totalDiasMesAnterior - i + 1;
        grid.innerHTML += `<div class="bg-[#09090b]/40 border border-borderSubtle/30 rounded-lg p-1 min-h-[50px] opacity-20 text-zinc-600 text-[10px] font-mono">${diaNum}</div>`;
      }

      for (let dia = 1; dia <= totalDiasMes; dia++) {
        const mesStr = String(mes + 1).padStart(2, '0');
        const diaStr = String(dia).padStart(2, '0');
        const fechaIso = `${anio}-${mesStr}-${diaStr}`;
        const esHoy = (dia === hoy.getDate() && mes === hoy.getMonth() && anio === hoy.getFullYear());

        const parcialesDelDia = eventosParcialesGlobal.filter(p => p.fecha === fechaIso);
        let eventosHtml = '';
        parcialesDelDia.forEach(p => {
          eventosHtml += `
            <div class="bg-zinc-800 text-zinc-200 text-[9px] px-1 py-0.5 rounded truncate font-mono mt-0.5" title="${p.materia}">
              ${p.materia}
            </div>
          `;
        });

        grid.innerHTML += `
          <div class="bg-[#09090b] border ${esHoy ? 'border-white' : 'border-borderSubtle'} rounded-lg p-1 min-h-[50px] flex flex-col justify-between">
            <span class="text-[10px] font-mono ${esHoy ? 'text-white font-bold' : 'text-zinc-400'}">${dia}</span>
            <div class="overflow-y-auto max-h-[30px]">${eventosHtml}</div>
          </div>
        `;
      }
    }

    document.getElementById('cal-prev').addEventListener('click', () => {
      fechaActualCal.setMonth(fechaActualCal.getMonth() - 1);
      renderizarCalendario();
    });

    document.getElementById('cal-next').addEventListener('click', () => {
      fechaActualCal.setMonth(fechaActualCal.getMonth() + 1);
      renderizarCalendario();
    });

    function bindDelete(className, node) {
      document.querySelectorAll(`.${className}`).forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          if (db) remove(ref(db, `${node}/${id}`));
        };
      });
    }
  </script>
</body>
</html>
